<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas AI - Kayıt Ol</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
        
        <!-- Logo / Başlık -->
        <div class="text-center space-y-2">
            <h2 class="text-3xl font-extrabold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">ATLAS AI</h2>
            <p class="text-slate-400 text-sm">Yeni bir SaaS hesabı oluşturun</p>
        </div>

        <!-- Hata Mesajı -->
        {% if error %}
        <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-3.5 rounded-lg text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <!-- Başarı Mesajı -->
        {% if success %}
        <div class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 p-3.5 rounded-lg text-sm text-center">
            {{ success }}
        </div>
        {% endif %}

        <!-- Kayıt Formu -->
        <form action="/register" method="post" class="space-y-4">
            <div>
                <label class="block text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2">Kullanıcı Adı</label>
                <input type="text" name="username" required placeholder="Kullanıcı adınızı belirleyin" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-blue-500 transition text-sm">
            </div>
            <div>
                <label class="block text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2">Şifre</label>
                <input type="password" name="password" required placeholder="Güçlü bir şifre girin" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-blue-500 transition text-sm">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition text-sm shadow-lg shadow-blue-500/20">Kayıt Ol</button>
        </form>

        <!-- Yönlendirme Linki -->
        <div class="text-center text-xs text-slate-400 pt-2 border-t border-slate-800">
            Zaten hesabınız var mı? <a href="/" class="text-blue-400 hover:underline font-semibold">Giriş Yap</a>
        </div>

    </div>
</body>
</html>

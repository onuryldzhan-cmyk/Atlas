<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Giriş Yap</title>
</head>
<body class="bg-slate-950 text-white flex h-screen items-center justify-center">
    <form action="/login" method="post" class="bg-slate-900 p-8 rounded-xl border border-slate-800 w-80">
        <h2 class="text-xl font-bold mb-4">Atlas AI Giriş</h2>
        <input type="text" name="username" placeholder="Kullanıcı Adı" class="w-full mb-4 p-2 bg-slate-800 border border-slate-700 rounded">
        <button type="submit" class="w-full bg-blue-600 p-2 rounded font-bold hover:bg-blue-700 transition">Giriş Yap</button>
    </form>
</body>
</html>

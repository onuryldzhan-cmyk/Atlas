name: Atlas CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Atlas Python Validation
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      # ==================================================
      # SOURCE
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ==================================================
      # PYTHON
      # ==================================================

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements/base.txt
            requirements/exchange-binance.txt
            requirements/web.txt
            requirements/dev.txt
            requirements/constraints.txt
            requirements/locks/windows-py314-runtime.txt
            requirements/locks/windows-py314-dev.txt

      - name: Show Python environment
        shell: pwsh
        run: |
          python --version
          python -m pip --version

      # ==================================================
      # DEPENDENCIES
      # ==================================================

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install locked development dependencies
        run: >
          python -m pip install
          --require-hashes
          -r requirements/locks/windows-py314-dev.txt

      - name: Validate dependency integrity
        run: python -m pip check

      # ==================================================
      # CANONICAL SOURCE VALIDATION
      # ==================================================

      - name: Compile canonical Python sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = git -c core.quotepath=false ls-files -- '*.py' |
            Where-Object {
              $_ -notmatch '(^|/)(archive[^/]*|[^/]*backup[^/]*|reports|quarantine)(/|$)'
            }

          if (-not $files) {
            throw "No canonical Python source files were selected for compilation."
          }

          Write-Host "Canonical Python files selected: $($files.Count)"

          $failed = @()

          foreach ($file in $files) {
            python -m py_compile "$file"

            if ($LASTEXITCODE -ne 0) {
              $failed += $file
            }
          }

          if ($failed.Count -gt 0) {
            Write-Host ""
            Write-Host "Python compilation failures:"

            foreach ($file in $failed) {
              Write-Host " - $file"
            }

            throw "Canonical Python compilation failed."
          }

          Write-Host "Canonical Python compilation: PASS"

      # ==================================================
      # TESTS
      # ==================================================

      - name: Run Atlas test suite
        shell: pwsh
        run: |
          python -m pytest `
            -q `
            --basetemp .pytest_atlas_ci

      # ==================================================
      # FINAL DIAGNOSTICS
      # ==================================================

      - name: Show resolved dependency versions
        if: always()
        shell: pwsh
        run: |
          python -m pip freeze

      - name: CI completion summary
        if: success()
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "ATLAS CI VALIDATION: PASS"
          Write-Host "======================================"
          Write-Host "Python setup:             PASS"
          Write-Host "Locked dependency install: PASS"
          Write-Host "Dependency integrity:     PASS"
          Write-Host "Canonical compilation:    PASS"
          Write-Host "Test suite:               PASS"
          Write-Host "======================================"

name: Atlas CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Atlas Python Validation
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      # ==================================================
      # SOURCE
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ==================================================
      # PYTHON
      # ==================================================

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements/base.txt
            requirements/exchange-binance.txt
            requirements/web.txt
            requirements/dev.txt
            requirements/constraints.txt
            requirements/locks/windows-py314-runtime.txt
            requirements/locks/windows-py314-dev.txt

      - name: Show Python environment
        shell: pwsh
        run: |
          python --version
          python -m pip --version

      # ==================================================
      # DEPENDENCIES
      # ==================================================

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install locked development dependencies
        run: >
          python -m pip install
          --require-hashes
          -r requirements/locks/windows-py314-dev.txt

      - name: Validate dependency integrity
        run: python -m pip check

      # ==================================================
      # CANONICAL SOURCE VALIDATION
      # ==================================================

      - name: Compile canonical Python sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = git -c core.quotepath=false ls-files -- '*.py' |
            Where-Object {
              $_ -notmatch '(^|/)(archive[^/]*|[^/]*backup[^/]*|reports|quarantine)(/|$)'
            }

          if (-not $files) {
            throw "No canonical Python source files were selected for compilation."
          }

          Write-Host "Canonical Python files selected: $($files.Count)"

          $failed = @()

          foreach ($file in $files) {
            python -m py_compile "$file"

            if ($LASTEXITCODE -ne 0) {
              $failed += $file
            }
          }

          if ($failed.Count -gt 0) {
            Write-Host ""
            Write-Host "Python compilation failures:"

            foreach ($file in $failed) {
              Write-Host " - $file"
            }

            throw "Canonical Python compilation failed."
          }

          Write-Host "Canonical Python compilation: PASS"

      # ==================================================
      # TESTS
      # ==================================================

      # The suite is invoked plainly, exactly as before this change. CI
      # deliberately does NOT wrap it in tools/generate_test_results_artifact.py:
      # the repository-root conftest.py hook already refreshes
      # reports/observability/test_results.{junit.xml,meta.json} as a side
      # effect of any complete full-suite run, so this plain invocation
      # produces the artifact here for free - and, more importantly, does the
      # same thing on the operator's machine, which is where the dashboard
      # actually reads from.
      #
      # continue-on-error lets the job proceed to the evaluation step below
      # even when pytest exits non-zero; this step's own outcome (visible in
      # the GitHub UI, unaffected by continue-on-error) still reports the raw
      # pytest result, so a real failure is never hidden here - only the
      # job's aggregate pass/fail verdict is deferred to the narrower check.
      - name: Run Atlas test suite
        id: tests
        shell: pwsh
        continue-on-error: true
        run: |
          python -m pytest `
            -q `
            --basetemp .pytest_atlas_ci

          if ($LASTEXITCODE -ne 0) {
            throw "Atlas test suite failed (pytest exit code $LASTEXITCODE)."
          }

      # CI build-criteria configuration for GRANT-B2-PERMANENT-CLOSURE
      # (registry v4.63, governance/findings/ARCH-EDGE-001_ANCESTOR_PACKAGE_FORBIDDEN_EDGES.md):
      # two atlas_finance ancestor-package forbidden edges are a final,
      # permanent owner decision to stay open and RED forever, by design.
      # This step does not touch the test, add a permitted_exceptions entry,
      # or add any xfail/skip marker - tools/ci_check_known_accepted_b2_failure.py
      # reads the JUnit XML the run above just produced and independently
      # re-derives the violation set the test itself computes. The aggregate
      # build is reported PASSING only when the suite's sole failure is
      # exactly this known case, and FAILING for anything else - a different
      # test failing, an additional failure alongside it, or any additional
      # or missing forbidden edge. See registry v4.90 for the CI-policy
      # decision this step implements.
      - name: Evaluate build status against GRANT-B2-PERMANENT-CLOSURE
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.tests.outcome }}' -eq 'success') {
            Write-Host "Test suite passed with zero failures; no known-accepted-failure evaluation needed."
            exit 0
          }

          python tools/ci_check_known_accepted_b2_failure.py `
            --junit-xml reports/observability/test_results.junit.xml

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed: the test suite has a failure that is not the known, permanently-accepted GRANT-B2-PERMANENT-CLOSURE case (registry v4.63)."
          }

      # Auditability only: makes each run's exact pass/fail breakdown, and
      # the commit it ran at, downloadable from the Actions run itself. It
      # does NOT reach the operator's locally-running dashboard -
      # reports/observability/ is gitignored by design and CI cannot write to
      # a local machine; the conftest.py hook covers that case instead.
      #
      # Gated on the test step having actually produced a verdict (rather
      # than always()), so `if-no-files-found: error` can stay strict and act
      # as a canary for the conftest hook silently breaking, without adding
      # confusing failures to builds that broke before the tests ever ran.
      - name: Upload observability test-results artifact
        if: always() && (steps.tests.conclusion == 'success' || steps.tests.conclusion == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-observability-test-results
          path: |
            reports/observability/test_results.junit.xml
            reports/observability/test_results.meta.json
          if-no-files-found: error

      # ==================================================
      # FINAL DIAGNOSTICS
      # ==================================================

      - name: Show resolved dependency versions
        if: always()
        shell: pwsh
        run: |
          python -m pip freeze

      - name: CI completion summary
        if: success()
        shell: pwsh
        run: |
          $testSuiteLine = "Test suite:               PASS"
          if ('${{ steps.tests.outcome }}' -ne 'success') {
            $testSuiteLine = "Test suite:               PASS (known-accepted GRANT-B2-PERMANENT-CLOSURE case, registry v4.63/v4.90)"
          }

          Write-Host "======================================"
          Write-Host "ATLAS CI VALIDATION: PASS"
          Write-Host "======================================"
          Write-Host "Python setup:             PASS"
          Write-Host "Locked dependency install: PASS"
          Write-Host "Dependency integrity:     PASS"
          Write-Host "Canonical compilation:    PASS"
          Write-Host $testSuiteLine
          Write-Host "======================================"

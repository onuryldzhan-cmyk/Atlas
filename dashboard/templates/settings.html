<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas AI - Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Segoe UI", sans-serif; background: #0a0e1a; color: #e0e6ed; }
        .sidebar { width: 250px; background: #111827; height: 100vh; position: fixed; padding: 20px; }
        .sidebar h2 { color: #3b82f6; margin-bottom: 30px; }
        .sidebar a { display: block; color: #94a3b8; text-decoration: none; padding: 12px 15px; border-radius: 8px; margin-bottom: 5px; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: #3b82f6; color: white; }
        .main { margin-left: 250px; padding: 30px; }
        .card { background: #1e293b; border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        .card h3 { color: #60a5fa; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 0.95em; }
        .form-group input, .form-group select { width: 100%; padding: 12px 15px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e0e6ed; font-size: 1em; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #3b82f6; }
        .btn { padding: 12px 30px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1em; transition: 0.3s; }
        .btn:hover { background: #2563eb; }
        .toggle { display: flex; align-items: center; gap: 15px; }
        .toggle-switch { width: 50px; height: 26px; background: #334155; border-radius: 13px; position: relative; cursor: pointer; transition: 0.3s; }
        .toggle-switch.active { background: #3b82f6; }
        .toggle-switch::after { content: ""; position: absolute; width: 22px; height: 22px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: 0.3s; }
        .toggle-switch.active::after { left: 26px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🧠 Atlas AI</h2>
        <a href="index.html">📊 Dashboard</a>
        <a href="analytics.html">📈 Analytics</a>
        <a href="signals.html">📡 Signals</a>
        <a href="trades.html">💰 Trades</a>
        <a href="settings.html" class="active">⚙️ Settings</a>
    </div>
    <div class="main">
        <h1>⚙️ Settings</h1>
        <div class="grid-2">
            <div class="card">
                <h3>Trading Configuration</h3>
                <div class="form-group">
                    <label>Trading Mode</label>
                    <select>
                        <option>Simulation (Paper Trading)</option>
                        <option>Live Trading</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Initial Balance (USDT)</label>
                    <input type="number" value="10000">
                </div>
                <div class="form-group">
                    <label>Risk Profile</label>
                    <select>
                        <option>Low Risk</option>
                        <option selected>Medium Risk</option>
                        <option>High Risk</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Max Positions</label>
                    <input type="number" value="10">
                </div>
            </div>
            <div class="card">
                <h3>API Configuration</h3>
                <div class="form-group">
                    <label>Exchange</label>
                    <select>
                        <option selected>Binance</option>
                        <option>Bybit</option>
                        <option>OKX</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" value="••••••••••••••••">
                </div>
                <div class="form-group">
                    <label>API Secret</label>
                    <input type="password" value="••••••••••••••••">
                </div>
                <div class="form-group">
                    <label>Timeframe</label>
                    <select>
                        <option>1m</option>
                        <option>5m</option>
                        <option selected>15m</option>
                        <option>1h</option>
                        <option>4h</option>
                        <option>1d</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="card">
            <h3>System Settings</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Kill Switch</label>
                    <div class="toggle">
                        <div class="toggle-switch active" onclick="this.classList.toggle('active')"></div>
                        <span>Enabled</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Telegram Notifications</label>
                    <div class="toggle">
                        <div class="toggle-switch" onclick="this.classList.toggle('active')"></div>
                        <span>Disabled</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>GitHub Backup</label>
                    <div class="toggle">
                        <div class="toggle-switch active" onclick="this.classList.toggle('active')"></div>
                        <span>Enabled</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Auto Learning</label>
                    <div class="toggle">
                        <div class="toggle-switch active" onclick="this.classList.toggle('active')"></div>
                        <span>Enabled</span>
                    </div>
                </div>
            </div>
            <div style="margin-top: 20px;">
                <button class="btn">💾 Save Settings</button>
            </div>
        </div>
    </div>
</body>
</html>
